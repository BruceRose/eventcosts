<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events Hub - Find Your Perfect Event Solution</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            transform: translateY(0);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .content {
            padding: 40px;
            min-height: 400px;
        }

        .question-section {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .question {
            font-size: 1.8em;
            color: #2d3748;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 1.1em;
            color: #718096;
            margin-bottom: 30px;
        }

        .options {
            display: grid;
            gap: 15px;
        }

        .option-card {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .option-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.1);
        }

        .option-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }

        .option-card:hover::before {
            transform: translateX(0);
        }

        .option-title {
            font-size: 1.3em;
            color: #2d3748;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .option-description {
            color: #718096;
            line-height: 1.5;
        }

        .result-section {
            background: #f7fafc;
            border-radius: 12px;
            padding: 30px;
            margin-top: 20px;
            animation: fadeIn 0.5s ease;
        }

        .result-title {
            font-size: 1.8em;
            color: #2d3748;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .result-content {
            color: #4a5568;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            color: #667eea;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            transform: translateX(-5px);
        }

        .back-button svg {
            margin-right: 8px;
        }

        .progress-bar {
            height: 4px;
            background: #e2e8f0;
            position: relative;
            margin-bottom: 30px;
            border-radius: 2px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .feature-item {
            display: flex;
            align-items: start;
            gap: 10px;
        }

        .feature-icon {
            color: #667eea;
            margin-top: 3px;
        }

        .contact-form {
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #4a5568;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome to Events Hub</h1>
            <p>Let's find the perfect solution for your event</p>
        </div>
        
        <div class="content" id="content">
            <!-- Dynamic content will be inserted here -->
        </div>
    </div>

    <script>
        const flowData = {
            start: {
                question: "What brings you here today?",
                subtitle: "We're here to help make your event extraordinary",
                progress: 20,
                options: [
                    {
                        title: "I need full event planning",
                        description: "From concept to execution, we'll handle everything",
                        next: "fullService"
                    },
                    {
                        title: "Just looking for a venue",
                        description: "Browse our curated selection of amazing spaces",
                        next: "venueOnly"
                    },
                    {
                        title: "I need specific services",
                        description: "Catering, AV, decor, or other event essentials",
                        next: "specificServices"
                    },
                    {
                        title: "Want to explore options",
                        description: "Not sure yet? Let's figure it out together",
                        next: "explore"
                    }
                ]
            },
            
            fullService: {
                question: "What type of event are you planning?",
                subtitle: "This helps us tailor our approach to your needs",
                progress: 40,
                options: [
                    {
                        title: "Corporate Event",
                        description: "Conferences, product launches, team building",
                        next: "corporate"
                    },
                    {
                        title: "Social Celebration",
                        description: "Weddings, birthdays, anniversaries",
                        next: "social"
                    },
                    {
                        title: "Public Event",
                        description: "Festivals, concerts, community gatherings",
                        next: "public"
                    },
                    {
                        title: "Something else",
                        description: "Unique or hybrid events",
                        next: "customEvent"
                    }
                ]
            },
            
            venueOnly: {
                question: "What size venue do you need?",
                subtitle: "We'll match you with the perfect space",
                progress: 40,
                options: [
                    {
                        title: "Intimate (up to 50 guests)",
                        description: "Cozy spaces for small gatherings",
                        next: "venueSmall"
                    },
                    {
                        title: "Medium (50-200 guests)",
                        description: "Versatile venues for most events",
                        next: "venueMedium"
                    },
                    {
                        title: "Large (200+ guests)",
                        description: "Grand spaces for major events",
                        next: "venueLarge"
                    },
                    {
                        title: "Multiple spaces needed",
                        description: "Complex events requiring various venues",
                        next: "venueMultiple"
                    }
                ]
            },
            
            specificServices: {
                question: "Which services do you need?",
                subtitle: "Select what you're looking for",
                progress: 40,
                options: [
                    {
                        title: "Catering & Bar",
                        description: "Food, beverages, and service staff",
                        next: "catering"
                    },
                    {
                        title: "Audio/Visual & Tech",
                        description: "Sound, lighting, screens, streaming",
                        next: "avTech"
                    },
                    {
                        title: "Decor & Design",
                        description: "Styling, flowers, furniture, themes",
                        next: "decor"
                    },
                    {
                        title: "Entertainment",
                        description: "Bands, DJs, speakers, performers",
                        next: "entertainment"
                    }
                ]
            },
            
            explore: {
                question: "How can we best help you?",
                subtitle: "Choose what feels right for you",
                progress: 40,
                options: [
                    {
                        title: "Show me recent events",
                        description: "Get inspired by our portfolio",
                        next: "portfolio"
                    },
                    {
                        title: "Talk to an expert",
                        description: "Free consultation with our team",
                        next: "consultation"
                    },
                    {
                        title: "Download planning guides",
                        description: "DIY resources and checklists",
                        next: "resources"
                    },
                    {
                        title: "Get a quick quote",
                        description: "Rough estimate for budget planning",
                        next: "quote"
                    }
                ]
            },
            
            corporate: {
                result: true,
                title: "Perfect! We're Corporate Event Specialists",
                content: "Our corporate events team has delivered 500+ successful business events. We understand the importance of brand representation, stakeholder engagement, and ROI.",
                features: [
                    "Dedicated account manager",
                    "Brand-aligned design",
                    "Tech-forward solutions",
                    "ROI reporting",
                    "Vendor management",
                    "Risk mitigation"
                ],
                cta: "Schedule Corporate Consultation"
            },
            
            social: {
                result: true,
                title: "Let's Create Unforgettable Memories!",
                content: "Our social events team specializes in turning your special moments into extraordinary celebrations. From intimate gatherings to grand affairs, we bring your vision to life.",
                features: [
                    "Personal event coordinator",
                    "Custom design concepts",
                    "Vendor curation",
                    "Timeline management",
                    "Guest experience focus",
                    "Memory preservation"
                ],
                cta: "Start Planning Your Celebration"
            },
            
            venueSmall: {
                result: true,
                title: "Intimate Venues That Inspire",
                content: "We have access to 50+ carefully selected intimate venues perfect for creating close connections and memorable experiences.",
                features: [
                    "Boutique hotels",
                    "Private dining rooms",
                    "Garden spaces",
                    "Historic buildings",
                    "Modern lofts",
                    "Exclusive clubs"
                ],
                cta: "Browse Intimate Venues"
            },
            
            consultation: {
                result: true,
                title: "Let's Talk About Your Vision",
                content: "Our expert consultants are ready to help you explore possibilities and create a custom solution that fits your needs and budget perfectly.",
                showContactForm: true,
                cta: "Book Free Consultation"
            },
            
            quote: {
                result: true,
                title: "Get Your Custom Quote",
                content: "Tell us about your event and we'll provide a detailed estimate within 24 hours. No obligations, just helpful information for your planning.",
                showContactForm: true,
                cta: "Request Quote"
            }
        };

        let currentStep = 'start';
        let history = [];

        function renderStep(stepId) {
            const step = flowData[stepId];
            const content = document.getElementById('content');
            
            if (step.result) {
                renderResult(step);
            } else {
                renderQuestion(step);
            }
        }

        function renderQuestion(step) {
            const content = document.getElementById('content');
            
            let html = '';
            
            if (history.length > 0) {
                html += `
                    <div class="back-button" onclick="goBack()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                        Back
                    </div>
                `;
            }
            
            html += `
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${step.progress}%"></div>
                </div>
                <div class="question-section">
                    <h2 class="question">${step.question}</h2>
                    <p class="subtitle">${step.subtitle}</p>
                    <div class="options">
            `;
            
            step.options.forEach(option => {
                html += `
                    <div class="option-card" onclick="selectOption('${option.next}')">
                        <div class="option-title">${option.title}</div>
                        <div class="option-description">${option.description}</div>
                    </div>
                `;
            });
            
            html += `
                    </div>
                </div>
            `;
            
            content.innerHTML = html;
        }

        function renderResult(result) {
            const content = document.getElementById('content');
            
            let html = `
                <div class="back-button" onclick="goBack()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Back
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 100%"></div>
                </div>
                <div class="result-section">
                    <h2 class="result-title">${result.title}</h2>
                    <div class="result-content">${result.content}</div>
            `;
            
            if (result.features) {
                html += '<div class="features-grid">';
                result.features.forEach(feature => {
                    html += `
                        <div class="feature-item">
                            <span class="feature-icon">✓</span>
                            <span>${feature}</span>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            if (result.showContactForm) {
                html += `
                    <div class="contact-form">
                        <div class="form-group">
                            <label>Your Name</label>
                            <input type="text" placeholder="John Smith">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" placeholder="john@company.com">
                        </div>
                        <div class="form-group">
                            <label>Phone (Optional)</label>
                            <input type="tel" placeholder="+1 234 567 8900">
                        </div>
                        <div class="form-group">
                            <label>Tell us about your event</label>
                            <textarea placeholder="Event type, date, guest count, special requirements..."></textarea>
                        </div>
                    </div>
                `;
            }
            
            html += `
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="handleCTA('${result.cta}')">${result.cta}</button>
                        <button class="btn btn-secondary" onclick="startOver()">Start Over</button>
                    </div>
                </div>
            `;
            
            content.innerHTML = html;
        }

        function selectOption(nextStep) {
            history.push(currentStep);
            currentStep = nextStep;
            renderStep(currentStep);
        }

        function goBack() {
            if (history.length > 0) {
                currentStep = history.pop();
                renderStep(currentStep);
            }
        }

        function startOver() {
            history = [];
            currentStep = 'start';
            renderStep(currentStep);
        }

        function handleCTA(action) {
            // In a real implementation, this would handle form submission,
            // redirect to booking system, etc.
            alert(`Action: ${action}\n\nIn production, this would:\n- Submit the form data\n- Send to CRM system\n- Redirect to booking calendar\n- Or trigger appropriate next step`);
        }

        // Initialize
        renderStep(currentStep);
    </script>
</body>
</html>
